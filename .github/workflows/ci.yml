name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: bash test_integration.sh
      - name: Install LLVM (libFuzzer runtime not in Apple clang)
        run: brew install llvm
      - name: Smoke-fuzz rules (30s)
        run: |
          make fuzz-rules FUZZ_CC="$(brew --prefix llvm)/bin/clang"
          ./fuzz_rules -max_total_time=30 || true
      - name: Smoke-fuzz parser (30s)
        run: |
          make fuzz-parse FUZZ_CC="$(brew --prefix llvm)/bin/clang"
          mkdir -p corpus && cp test_*.pdf corpus/
          ./fuzz_parse corpus -max_total_time=30 || true
      - name: Smoke-fuzz verify path (30s)
        run: |
          make fuzz-verify FUZZ_CC="$(brew --prefix llvm)/bin/clang"
          mkdir -p corpus && cp test_*.pdf corpus/
          ./fuzz_verify corpus -max_total_time=30 || true
  asan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: ASan unit + parser fuzz
        run: |
          make CFLAGS="-O1 -g -fsanitize=address,undefined -Wall" test_all test_crypto
          ./test_all && ./test_crypto
      - name: ASan + differential verify fuzz (hard gate)
        run: |
          make verify_fuzz_standalone
          VERIFY_FUZZ_ITERS=100000 ./verify_fuzz_standalone test_*.pdf
